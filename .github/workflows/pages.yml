name: Publish encrypted Model Cards
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package encrypted portal only
        run: |
          mkdir -p _site
          cp index.html app.js auth.js style.css catalog.parts.json catalog-*.enc _site/
          touch _site/.nojekyll
          test ! -e _site/data.json
          test ! -d _site/assets
          node --check app.js
          node --check auth.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
